<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Journal | Wellness Companion</title>
<style>
  :root { --teal:#008080; --teal-dark:#00695c; --bg:#f4f8fb; --muted:#6b7a86; }
  * { box-sizing: border-box; margin:0; padding:0; font-family:"Segoe UI", Arial, sans-serif; }
  body { background: linear-gradient(135deg,#f2fffc,#f7fbff); color:#233; }
  header { background: linear-gradient(90deg, var(--teal), #0d8f8f); color:white; padding:22px 6%; text-align:center; font-size:1.6rem; font-weight:800; }
  .container { max-width: 920px; margin: 36px auto; background:white; border-radius: 22px; padding: 30px; box-shadow:0 12px 30px rgba(0,0,0,0.08); }
  .title { text-align:center; color: var(--teal-dark); margin-bottom: 8px; }
  .subtitle { text-align:center; color: var(--muted); margin-bottom: 22px; }
  .grid { display:grid; grid-template-columns: 1.1fr 0.9fr; gap: 22px; }
  .panel { background:#f9fcfd; border:1px solid #edf4f4; border-radius: 16px; padding: 18px; }
  .panel h3 { color: var(--teal-dark); margin-bottom: 10px; }
  .field label { display:block; font-weight:700; margin-bottom:6px; color: var(--teal-dark); }
  input, textarea { width:100%; padding: 12px 14px; border: 1px solid #d6e5e4; border-radius: 10px; font-size: 1rem; }
  textarea { min-height: 150px; resize: vertical; }
  .actions { display:flex; gap: 12px; margin-top: 14px; }
  button { flex:1; border:none; border-radius:10px; padding:12px 14px; cursor:pointer; font-weight:700; color:white; background: var(--teal); }
  button.secondary { background:#e74c3c; }
  .prompt { padding:12px 14px; border-radius:10px; background:white; margin-top: 10px; color: var(--muted); }
  .preview { margin-top: 16px; background:white; border-left:4px solid var(--teal); padding: 14px; border-radius: 10px; color: var(--muted); display:none; }
  .back { display:inline-block; margin-top:18px; color: var(--teal); font-weight:700; text-decoration:none; }
  @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <header>📖 Daily Journal</header>
  <div class="container">
    <h2 class="title">Write your thoughts</h2>
    <p class="subtitle">Let your journal be a gentle place to reflect, reset, and notice how you feel.</p>

    <div class="grid">
      <div class="panel">
        <form action="/journal" method="post" onsubmit="return showPreview()">
          <div class="field">
            <label for="username">Your name</label>
            <input type="text" id="username" name="username" placeholder="Enter your name" required>
          </div>
          <div class="field">
            <label for="title">Journal title</label>
            <input type="text" id="title" name="title" placeholder="A title for today" required>
          </div>
          <div class="field">
            <label for="entry">What happened today?</label>
            <textarea id="entry" name="entry" placeholder="Write your reflection here..." required></textarea>
          </div>
          <div class="actions">
            <button type="submit">Save entry</button>
            <button type="button" class="secondary" onclick="clearFields()">Clear</button>
          </div>
        </form>
        <div class="preview" id="preview"></div>
      </div>

      <div class="panel">
        <h3>Reflection prompts</h3>
        <div class="prompt">What helped you feel calm today?</div>
        <div class="prompt">What do you want to carry into tomorrow?</div>
        <div class="prompt">What is one thing you are proud of today?</div>
      </div>
    </div>
    <a href="dashboard.html" class="back">⬅ Back to dashboard</a>
  </div>

  <script>
    function showPreview() {
      const title = document.getElementById('title').value.trim();
      const entry = document.getElementById('entry').value.trim();
      const preview = document.getElementById('preview');
      if (!title || !entry) {
        alert('Please add a title and some journal text.');
        return false;
      }
      const date = new Date().toLocaleString();
      preview.style.display = 'block';
      preview.innerHTML = `<strong>${title}</strong><br><small>${date}</small><p>${entry}</p>`;
      return true;
    }

    function clearFields() {
      document.getElementById('username').value = '';
      document.getElementById('title').value = '';
      document.getElementById('entry').value = '';
      document.getElementById('preview').style.display = 'none';
    }
  </script>
  <script>
    let username = localStorage.getItem("username") || "";

    document.getElementById("username").value = username;

    console.log("Journal username:", username);

    if (!username) {
        alert("Username not found. Please login again.");
    }
</script>
</body>
</html>
